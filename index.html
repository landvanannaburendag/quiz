<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotoquiz</title>
<style>
:root{--bg:#f4f1eb;--card:#fff;--ink:#202124;--muted:#6d6a64;--accent:#3158c9;--line:#ddd8cf;--good:#177245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:920px;margin:auto;padding:24px 16px 60px}header{text-align:center;margin-bottom:20px}h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 6px}.sub{color:var(--muted);margin:0}
.decoder{position:sticky;top:0;z-index:20;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.decoder-inner,.wordbox,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px #0000000b}.decoder-inner{padding:14px}.title{font-weight:800;margin-bottom:10px}.key{display:flex;flex-wrap:wrap;gap:7px}.key span{padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#faf9f7;font-size:.92rem}
.progress{color:var(--muted);font-size:.9rem;margin:16px 2px}.quiz{display:grid;gap:18px}.card{overflow:hidden}.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;background:#e8e5df}.missing{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;color:#777;background:#e8e5df;padding:20px}.body{padding:16px}.house{font-size:1.15rem;font-weight:800;margin-bottom:11px}.row{display:flex;align-items:center;gap:10px}input{width:62px;height:48px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:1.3rem;text-transform:uppercase;outline:0}input:focus{border-color:var(--accent)}
.wordbox{text-align:center;margin-top:24px;padding:18px}.word{font-size:clamp(1.7rem,7vw,3rem);font-weight:900;letter-spacing:.25em;min-height:1.2em}.hint{color:var(--muted);font-size:.9rem;margin-top:7px}.success{display:none;color:var(--good);font-weight:800;margin-top:12px}
@media(min-width:720px){.quiz{grid-template-columns:1fr 1fr}.card:last-child:nth-child(odd){grid-column:1/-1}}

   .submit-box {
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--line);
  text-align:left;
}

.submit-box h2 {
  font-size:1.2rem;
  margin:0 0 14px;
}

.submit-box label {
  display:block;
  font-weight:600;
  margin-bottom:6px;
}

.name-input {
  width:100%;
  height:48px;
  text-align:left;
  text-transform:none;
  font-size:1rem;
  padding:0 12px;
  margin-bottom:12px;
}

.submit-box button {
  border:0;
  background:var(--accent);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-size:1rem;
  cursor:pointer;
}

.submit-message {
  margin-top:10px;
  font-size:.92rem;
  color:var(--muted);
}

</style>
</head>
<body><main>
<header><h1>📷 Fotoquiz</h1><p class="sub">Vind het perceel dat het dichtste aan de foto grenst, vul de letter in die bij het huisnummer hoort en ontdek het geheime woord.</p></header>
<section class="decoder"><div class="decoder-inner"><div class="title">🔑 Cijfer → letter</div><div class="key" id="key"></div></div></section>
<div class="progress" id="progress"></div><section class="quiz" id="quiz"></section>
<section class="wordbox">
   
<div class="word-box">
  <div><strong>Geheime woord</strong></div>
  <div class="word" id="word"></div>
  <div class="hint">Vul bij elke foto één letter in.</div>

  <div class="success" id="success">
    🎉 Goed gedaan! Je hebt het woord gevonden.
  </div>

  <div class="submit-box">
    <h2>Antwoord insturen</h2>

    <label for="naam">Naam</label>
    <input
      id="naam"
      class="name-input"
      type="text"
      autocomplete="name"
      placeholder="Jouw naam"
    >

    <button id="submitButton" type="button">
      Antwoord insturen
    </button>

    <div class="submit-message" id="submitMessage"></div>
  </div>
</div>

</section>
</main>
<script>
/* ==========================================================
   ALLEEN DIT DEEL HOEF JE AAN TE PASSEN
   ========================================================== */
const cijferNaarLetter = {
  1:"D", 2:"L", 3:"E", 4:"K", 5:"T", 6:"H", 7:"G", 8:"Z", 9:"A", 10:"P", 11:"S", 12:"M", 13:"O", 14:"V", 15:"R", 16:"B", 17:"I", 18:"J", 19:"F", 20:"U"
};

const vragen = [
  {huis:1, foto:"fotos/gm2.jpeg"},
  {huis:2, foto:"fotos/dv3.jpeg"},
  {huis:3, foto:"fotos/wb1.jpeg"},
  {huis:4, foto:"fotos/dv5.jpeg"},
  {huis:5, foto:"fotos/hvp9.jpeg"},
  {huis:6, foto:"fotos/dv2.jpeg"},
  {huis:7, foto:"fotos/dv20.jpeg"},
  {huis:8, foto:"fotos/hvp1.jpeg"}

];

// Laat leeg ("") als je geen automatische controle wilt.
const juisteWoord = "";
/* ========================================================== */
const GOOGLE_FORM_URL = 
  "https://docs.google.com/forms/d/e/1FAIpQLSebW2yrvrGmrFdsrRs_W8BL35glJRTStxoAyxNOAyQdMKDgmg/formResponse";

const GOOGLE_FORM_NAME_ENTRY = "entry.699970918";
const GOOGLE_FORM_ANSWER_ENTRY = "entry.88578047";
/* ========================================================== */

const key=document.getElementById('key'),quiz=document.getElementById('quiz'),word=document.getElementById('word'),progress=document.getElementById('progress'),success=document.getElementById('success');
Object.entries(cijferNaarLetter).forEach(([n,l])=>{const s=document.('span');s.textContent=`${n} = ${l}`;key.appendChild(s)});
vragen.forEach((v,i)=>{
  const card=document.('article');card.className='card';
  const img=document.('img');img.className='photo';img.src=v.foto;img.alt=`Foto bij huisnummer ${v.huis}`;
  img.onerror=()=>{const d=document.('div');d.className='missing';d.innerHTML=`<div><b>Foto ontbreekt</b><br>${v.foto}</div>`;img.replaceWith(d)};
  const body=document.('div');body.className='body';
  const h=document.('div');h.className='house';h.textContent=`Huisnummer ${v.huis}`;
  const row=document.('div');row.className='row';row.innerHTML='<label>Jouw letter:</label>';
  const input=document.('input');input.maxLength=1;input.autocomplete='off';input.setAttribute('aria-label',`Letter voor huisnummer ${v.huis}`);
  input.addEventListener('input',()=>{input.value=input.value.replace(/[^a-z]/gi,'').toUpperCase();update()});row.appendChild(input);body.append(h,row);card.append(img,body);quiz.appendChild(card);
});
function update(){
  const inputs = [...document.querySelectorAll('input[id^="antwoord-"]')];
  const letters = inputs.map(i => i.value || '_');
  const filled = inputs.filter(i => i.value).length;

  word.textContent = letters.join('');
  progress.textContent = `${filled} van ${inputs.length} antwoorden ingevuld`;

  success.style.display =
    juisteWoord &&
    filled === inputs.length &&
    inputs.map(i => i.value).join('') === juisteWoord.toUpperCase()
      ? 'block'
      : 'none';
}

update();

document.getElementById("submitButton").addEventListener("click", () => {
  const message = document.getElementById("submitMessage");
  const naam = document.getElementById("naam").value.trim();

  const inputs = [...document.querySelectorAll('input[id^="antwoord-"]')];
  const antwoord = inputs.map(input => input.value).join("");

  if (!naam) {
    message.textContent = "Vul eerst je naam in.";
    document.getElementById("naam").focus();
    return;
  }

  if (antwoord.length !== inputs.length) {
    message.textContent = `Vul eerst alle ${inputs.length} letters in.`;
    return;
  }

  const formData = new URLSearchParams();

  formData.append(GOOGLE_FORM_NAME_ENTRY, naam);
  formData.append(GOOGLE_FORM_ANSWER_ENTRY, antwoord);

  fetch(GOOGLE_FORM_URL, {
    method: "POST",
    mode: "no-cors",
    body: formData
  })
  .then(() => {
    message.textContent = "✅ Je antwoord is ingestuurd!";
    document.getElementById("submitButton").disabled = true;
  })
  .catch(() => {
    message.textContent =
      "Er ging iets mis met insturen. Controleer de Google Forms-instellingen.";
  });
});

</script></body></html>
