<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotoquiz</title>
<style>
:root{--bg:#ffffff;--card:#fff;--ink:#202124;--muted:#6d6a64;--accent:#ee7d1f;--line:#ddd8cf;--good:#177245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:920px;margin:auto;padding:24px 16px 60px}
header{
  position:relative;
  text-align:center;
  margin-bottom:20px;
  min-height:220px;
  display:flex;
  flex-direction:column;
  justify-content:flex-start;
  align-items:center;
  padding:90px 40px 30px;
  background:white;
  border-radius:18px;
  overflow:hidden;
}

header::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("fotos/rand.png") center top / 100% auto no-repeat;
  pointer-events:none;
}

header h1,
header .sub{
  position:relative;
  z-index:1;
}
   h1{font-size:clamp(2rem,6vw,3rem);margin:0 0 6px}.sub{color:var(--muted);margin:0}
.decoder{position:sticky;top:0;z-index:20;padding:10px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
  .decoder-image{
  display:block;
  width:100%;
  max-width:700px;
  height:auto;
  margin:auto;
}
.decoder-inner,.wordbox,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 16px #0000000b}.decoder-inner{padding:14px}.title{font-weight:800;margin-bottom:10px}.key{display:flex;flex-wrap:wrap;gap:7px}.key span{padding:6px 9px;border:1px solid var(--line);border-radius:9px;background:#faf9f7;font-size:.92rem}
.progress{color:var(--muted);font-size:.9rem;margin:16px 2px}.quiz{display:grid;gap:18px}.card{overflow:hidden}.photo{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#e8e5df}.missing{aspect-ratio:16/10;display:grid;place-items:center;text-align:center;color:#777;background:#e8e5df;padding:20px}.body{padding:16px}.house{font-size:1.15rem;font-weight:800;margin-bottom:11px}.row{display:flex;align-items:center;gap:10px}input{width:62px;height:48px;border:2px solid var(--line);border-radius:10px;text-align:center;font-size:1.3rem;text-transform:uppercase;outline:0}input:focus{border-color:var(--accent)}
.wordbox{text-align:center;margin-top:24px;padding:18px}.word{font-size:clamp(1.7rem,7vw,3rem);font-weight:900;letter-spacing:.25em;min-height:1.2em}.hint{color:var(--muted);font-size:.9rem;margin-top:7px}.success{display:none;color:var(--good);font-weight:800;margin-top:12px}
@media(min-width:720px){.quiz{grid-template-columns:1fr 1fr}.card:last-child:nth-child(odd){grid-column:1/-1}}

   .submit-box {
  margin-top:24px;
  padding-top:20px;
  border-top:1px solid var(--line);
  text-align:left;
}

.submit-box h2 {
  font-size:1.2rem;
  margin:0 0 14px;
}

.submit-box label {
  display:block;
  font-weight:600;
  margin-bottom:6px;
}

.name-input {
  width:100%;
  height:48px;
  text-align:left;
  text-transform:none;
  font-size:1rem;
  padding:0 12px;
  margin-bottom:12px;
}

.submit-box button {
  border:0;
  background:var(--accent);
  color:white;
  padding:12px 18px;
  border-radius:10px;
  font-size:1rem;
  cursor:pointer;
}

.submit-message {
  margin-top:10px;
  font-size:.92rem;
  color:var(--muted);
}

.quizwoord {
  display: inline-block;
  white-space: nowrap;
}

.woordspatie {
  display: inline-block;
  width: 1.2em;
}
.title-icon{
  width:32px;
  height:32px;
  object-fit:contain;
  vertical-align:-5px;
}
.section-icon{ width:24px; height:24px; object-fit:contain; vertical-align:-5px; }

</style>
</head>
<body><main>

  
<header><h1><img src="fotos/camera.png" class="title-icon"> Fotoquiz</h1><p class="sub">Vind het perceel dat het dichtste aan de foto grenst, vul de letter in die bij het huisnummer hoort en ontdek het geheime woord. <br><br> <p style="color: orange; font-size: 20px;"> NOG EVEN GEDULD!</p></header>


</script></body></html>
